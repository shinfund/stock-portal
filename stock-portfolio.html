<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>포트폴리오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
b,strong{font-weight:500}
:root {
  --sky:#0366D6; --sky50:#E9F1FE; --sky100:#C7DCF6; --sky600:#005CC5; --sky800:#032F62;
  --teal:#1D9E75; --teal50:#E1F5EE; --teal100:#9FE1CB; --teal600:#0F6E56;
  --coral:#D85A30; --coral50:#FAECE7; --coral100:#F5C4B3;
  --amber:#BA7517; --amber50:#FAEEDA; --amber100:#FAC775;
  --purple:#534AB7; --purple50:#EEEDFE; --purple100:#CECBF6;
  --gray50:#F1EFE8; --gray100:#D3D1C7; --gray600:#5F5E5A;
  --bg:#FFFFFF; --card:#FFFFFF; --border:#E1E4E8; --border2:#F6F8FA;
  --txt:#24292E; --txt2:#3A4453; --txt3:#6A737D;
  --red:var(--coral); --red50:var(--coral50); --blue:var(--sky); --blue50:var(--sky50);
  --hdrbg:#0B4A36; --hdr-text:#fff; --hdr-text-dim:rgba(255,255,255,.85);
  --hdr-btn-bg:rgba(255,255,255,.15); --hdr-btn-border:rgba(255,255,255,.35);
  --hdr-btn-hover-bg:rgba(255,255,255,.25); --hdr-btn-text:#fff;
  --hdr-shadow:0 2px 8px rgba(11,74,54,.3);
  --r6:6px; --r8:8px; --r10:10px; --r12:12px; --r14:14px; --r16:16px; --r20:20px;
  --shadow:none;
  --shadow-h:0 20px 60px rgba(0,0,0,.2);
}
html[data-theme="light"]{
  --hdrbg:#FFFFFF; --hdr-text:#0B4A36; --hdr-text-dim:#2D6E56;
  --hdr-btn-bg:#E4F5EE; --hdr-btn-border:#B7E2D0; --hdr-btn-hover-bg:#CDEEE0; --hdr-btn-text:#0F6E56;
  --hdr-shadow:0 2px 8px rgba(11,74,54,.12);
}
html[data-theme="dark"]{
  --bg:#24292E; --card:#1C2024;
  --border:rgba(255,255,255,.13); --border2:rgba(255,255,255,.09);
  --txt:rgba(255,255,255,.92); --txt2:rgba(255,255,255,.75); --txt3:rgba(255,255,255,.5);
  --shadow:none; --shadow-h:0 20px 60px rgba(0,0,0,.5);
  --hdrbg:#24292E; --hdr-shadow:0 2px 10px rgba(0,0,0,.4);
  --sky:#2E8FFF; --sky50:rgba(46,143,255,.16); --sky100:rgba(46,143,255,.32); --sky600:#79B8FF; --sky800:#C8E1FF;
  --teal:#4FD8AC; --teal50:rgba(29,158,117,.16); --teal100:rgba(29,158,117,.32); --teal600:#4FD8AC;
  --coral:#F2896A; --coral50:rgba(216,90,48,.16); --coral100:rgba(216,90,48,.32);
  --amber:#E8A93D; --amber50:rgba(186,117,23,.22); --amber100:rgba(186,117,23,.38);
  --purple:#B4A6FF; --purple50:rgba(83,74,183,.26); --purple100:rgba(83,74,183,.4);
  --gray50:rgba(255,255,255,.10); --gray600:#C9C7BF;
  --red:var(--coral); --red50:var(--coral50); --blue:var(--sky); --blue50:var(--sky50);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans KR','Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;font-size:14.5px;background:var(--bg);color:var(--txt);word-break:keep-all}
html{scrollbar-width:none}
html::-webkit-scrollbar{display:none}
.hdr-wrap{position:fixed;top:0;left:0;right:0;z-index:50;box-shadow:var(--hdr-shadow);transition:background .18s ease}
.header{background:var(--hdrbg);padding:max(12px,env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;justify-content:space-between;transition:background .18s ease}
.header-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0;overflow:hidden}
.logo-info{display:flex;flex-direction:column;gap:1px;min-width:0;overflow:hidden}
.logo-title{font-size:14.5px;font-weight:500;color:var(--hdr-text);letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .18s ease}
.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:10px}
.hdr-date{font-size:11px;font-weight:400;color:var(--hdr-text-dim);white-space:nowrap;transition:color .18s ease}
.hdr-btn{background:var(--hdr-btn-bg);border:1px solid var(--hdr-btn-border);color:var(--hdr-btn-text);font-size:13px;font-weight:500;padding:6px 12px;border-radius:16px;cursor:pointer;white-space:nowrap;font-family:inherit;transition:background .12s}
.hdr-btn:hover{background:var(--hdr-btn-hover-bg)}
.top-nav{background:var(--card);border-bottom:1.5px solid var(--border);display:flex;padding:0 4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
.top-nav::-webkit-scrollbar{display:none}
.tab-btn{flex:1;flex-shrink:0;min-width:64px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;color:var(--txt);font-size:14px;font-weight:400;font-family:inherit;cursor:pointer;padding:13px 6px;touch-action:manipulation;transition:color .15s;position:relative;white-space:nowrap}
.tab-btn.on{color:var(--sky600)}
.tab-btn.on::after{content:'';position:absolute;bottom:0;left:8%;right:8%;height:2.5px;background:var(--sky);border-radius:2px 2px 0 0}
.nav-spacer{height:calc(104px + env(safe-area-inset-top,0px))}
html.in-portal .hdr-wrap{position:static;box-shadow:none}
html.in-portal .nav-spacer{display:none}
.wrap{margin:0}
.main{padding:0 16px max(20px,env(safe-area-inset-bottom))}
.panel{display:none}
.panel.on{display:block;animation:fade .22s}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.kpi-row{display:flex;gap:9px;margin-bottom:14px;padding-top:10px;flex-wrap:wrap}
.kpi-card{flex:1;min-width:100px;background:var(--card);border:1px solid var(--border);border-radius:var(--r12);padding:10px 10px;text-align:center;box-shadow:var(--shadow)}
.kpi-card .num{font-size:18px;font-weight:500;line-height:1.1}
.kpi-card .lbl{font-size:12.5px;margin-top:4px;font-weight:500;color:var(--txt2)}
.kpi-sky .num{color:var(--sky600)}
.kpi-red .num{color:var(--red)}
.kpi-teal .num{color:var(--teal600)}
.kpi-coral .num{color:var(--coral)}
.kpi-amber .num{color:var(--amber)}
.kpi-purple .num{color:var(--purple)}
.sc{background:var(--card);border-radius:var(--r12);border:1px solid var(--border);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.sc-title{font-size:14.5px;font-weight:500;color:var(--txt);margin-bottom:12px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.sc-title .sub{font-size:13.5px;font-weight:400;color:var(--txt2)}
.sc-note{font-size:14px;color:var(--txt2);margin-bottom:12px;line-height:1.6;padding:8px 10px;background:var(--bg);border-radius:var(--r8)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r8);overscroll-behavior-x:contain;margin-bottom:8px}
table{min-width:100%;border-collapse:collapse;font-size:13.5px}
thead th{background:var(--sky50);color:var(--sky800);font-weight:400;font-size:13.5px;padding:9px 8px;text-align:right;white-space:nowrap}
html[data-theme="dark"] thead th{color:#fff}
thead th.l{text-align:left} thead th.c{text-align:center}
tbody td{padding:9px 8px;border-bottom:1px solid var(--border2);text-align:right;white-space:nowrap;color:var(--txt)}
tbody td.l{text-align:left} tbody td.c{text-align:center}
tbody tr:hover{background:var(--teal50)}
.t-neg{color:var(--blue);font-weight:400}
.t-pos{color:var(--red);font-weight:400}
.t-flat{color:var(--txt2);font-weight:400}
.badge{display:inline-flex;align-items:center;font-size:12.5px;font-weight:400;padding:2px 9px;border-radius:10px;white-space:nowrap;color:#fff;border:1px solid rgba(0,0,0,.18);margin:2px 0}
.bdg-red{background:#B71C1C}
.bdg-blue{background:#1565C0}
.bdg-sky{background:#0277BD}
.bdg-teal{background:#0D6D63}
.bdg-amber{background:#8F5A00}
.bdg-coral{background:#B23A12}
.bdg-gray{background:#52606B}
.bdg-purple{background:#5B4FBD}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pill{border:1.5px solid var(--border);background:var(--card);color:var(--txt2);font-size:13px;font-weight:500;padding:6px 13px;border-radius:99px;cursor:pointer;font-family:inherit;transition:all .12s;white-space:nowrap}
.pill:hover{border-color:var(--sky100)}
.pill.on{background:var(--sky800);border-color:var(--sky800);color:#fff}
html[data-theme="dark"] .pill.on{background:#0C447C;border-color:#0C447C}
.date-sel{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}

.empty-box{text-align:center;color:var(--txt3);padding:40px 20px}
.login-box{text-align:center;padding:36px 20px}
.login-box .lb-title{font-size:15px;font-weight:500;color:var(--txt);margin-bottom:8px}
.login-box .lb-sub{font-size:13.5px;color:var(--txt2);margin-bottom:16px;line-height:1.6}
.login-box input{width:100%;max-width:260px;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r8);padding:9px 12px;font-size:14px;font-family:inherit;color:var(--txt);outline:none;margin-bottom:10px;text-align:center}
.login-box input:focus{border-color:var(--sky)}
.login-box button{background:var(--sky);border:none;color:#fff;border-radius:var(--r8);padding:9px 22px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.login-box .lb-err{color:var(--red);font-size:13px;margin-top:8px;min-height:18px}
#settingsModal{display:none;position:fixed;inset:0;z-index:100}
#settingsModal.modal-open{display:block}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--card);border-radius:var(--r16);padding:20px;width:100%;max-width:340px;box-shadow:var(--shadow-h)}
.modal-title{font-size:16px;font-weight:500;color:var(--txt);margin-bottom:14px}
.modal-section{font-size:13.5px;font-weight:500;color:var(--txt2);margin-bottom:8px;margin-top:16px}
.modal-section:first-of-type{margin-top:0}
.theme-opts{display:flex;gap:10px}
.theme-opt{flex:1;cursor:pointer;text-align:center;padding:8px;border-radius:var(--r12);border:2px solid var(--border);position:relative;transition:border-color .12s}
.theme-opt.on{border-color:var(--teal)}
.theme-opt.on::after{content:'✓';position:absolute;top:5px;right:7px;width:16px;height:16px;background:var(--teal);color:#fff;border-radius:50%;font-size:10px;font-weight:500;display:flex;align-items:center;justify-content:center}
.theme-swatch{width:100%;height:50px;border-radius:8px;border:1px solid var(--border2);margin-bottom:6px;position:relative;overflow:hidden}
.theme-swatch-dark{background:#24292E}
.theme-swatch-light{background:#FFFFFF}
.theme-swatch-dark .ts-side{background:#24292E;border-right:1px solid rgba(255,255,255,.08)}
.theme-swatch-light .ts-side{background:#FFFFFF;border-right:1px solid #DCE9F7}
.ts-side{position:absolute;left:0;top:0;bottom:0;width:30%}
.theme-opt-label{font-size:13px;font-weight:500;color:var(--txt)}
.modal-hint{font-size:12.5px;color:var(--txt3);margin-top:8px;line-height:1.6}
.modal-close-btn{width:100%;margin-top:16px;background:var(--bg);border:1.5px solid var(--border);color:var(--txt2);border-radius:var(--r8);padding:9px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
html[data-theme="dark"]{--txt2:#fff;--txt3:rgba(255,255,255,.92)}
html[data-theme="dark"] .tab-btn.on{color:#fff}
@media(max-width:374px){.logo-sub{display:none} .tab-btn{font-size:13px;padding:11px 2px;min-width:52px} .kpi-card .num{font-size:16px} .kpi-card .lbl{font-size:12px}}
@media(max-width:600px){
  .nav-spacer{height:calc(108px + env(safe-area-inset-top,0px))}
  .main{padding:0 10px max(20px,env(safe-area-inset-bottom))}
  .sc{padding:12px 12px} .tab-btn{font-size:13.5px;padding:12px 4px}
  .kpi-card .num{font-size:17px} .kpi-card .lbl{font-size:12px}
  table{font-size:13px} thead th,tbody td{padding:8px 5px}

@media(min-width:769px){

  table{font-size:14px} thead th,tbody td{padding:10px 9px}
}
@media(min-width:1024px){.kpi-row{gap:12px} .tab-btn{flex:0 1 160px}}
</style>

<script>
// ── Notion 연동 (읽기 전용 대시보드) ────────────────────────────
const WORKER_URL = 'https://notion-proxy.shinfund.workers.dev';
const HOLDINGS_DB_ID = '9f666aeb-832a-4aa2-9e52-e37515b75e56';
const DAYTRADE_DB_ID = '3c859c8c-9c0a-80ea-8bee-f8c263fbbd7c';

let AUTH = { token:'', expires:0 };
(function(){
  try{
    AUTH.token = localStorage.getItem('sp_notionAuthToken') || '';
    AUTH.expires = parseInt(localStorage.getItem('sp_notionAuthExpires')||'0',10) || 0;
  }catch(e){}
})();
function isAuthed(){ return !!AUTH.token && Date.now() < AUTH.expires; }

const STRATEGY_BADGE = {
  '눌림목':'bdg-teal', '괴리율':'bdg-coral', '라운드넘버':'bdg-purple',
  '기준선':'bdg-amber', '장대양봉':'bdg-sky', '미분류':'bdg-gray'
};
function strategyBadge(name){
  const s = name || '미분류';
  return '<span class="badge '+(STRATEGY_BADGE[s]||'bdg-gray')+'">'+esc(s)+'</span>';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtNum(n){ return (Number(n)||0).toLocaleString('ko-KR',{maximumFractionDigits:2}); }
function fmtPct(n){ const v=(Number(n)||0)*100; return (v>=0?'+':'')+v.toFixed(2)+'%'; }
function pctClass(n){ return (Number(n)||0) < 0 ? 't-neg' : (Number(n)||0) > 0 ? 't-pos' : 't-flat'; }

async function login(password){
  const res = await fetch(WORKER_URL+'/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({password})
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error || ('HTTP '+res.status));
  return data;
}
function doLogin(){
  const pw = document.getElementById('loginPw').value;
  const errEl = document.getElementById('loginErr');
  errEl.textContent = '';
  if(!pw){ errEl.textContent = '비밀번호를 입력하세요.'; return; }
  login(pw).then(data=>{
    AUTH.token = data.token; AUTH.expires = data.expires;
    try{
      localStorage.setItem('sp_notionAuthToken', AUTH.token);
      localStorage.setItem('sp_notionAuthExpires', String(AUTH.expires));
    }catch(e){}
    applyAuthUI();
    loadData();
  }).catch(e=>{ errEl.textContent = '로그인 실패: '+e.message; });
}
function doLogout(){
  AUTH = {token:'', expires:0};
  try{ localStorage.removeItem('sp_notionAuthToken'); localStorage.removeItem('sp_notionAuthExpires'); }catch(e){}
  applyAuthUI();
  closeSettingsModal();
}
function applyAuthUI(){
  const authed = isAuthed();
  document.getElementById('holdings-login').style.display = authed ? 'none' : 'block';
  document.getElementById('holdings-body').style.display = authed ? 'block' : 'none';
  document.getElementById('daytrade-login').style.display = authed ? 'none' : 'block';
  document.getElementById('daytrade-body').style.display = authed ? 'block' : 'none';
  document.getElementById('cfgAuthHint').textContent = authed
    ? '로그인됨 · '+new Date(AUTH.expires).toLocaleDateString('ko-KR')+'까지 유지'
    : '로그인되어 있지 않습니다. 보유종목 탭에서 로그인하세요.';
  document.getElementById('cfgLogoutBtn').style.display = authed ? 'block' : 'none';
}

async function fetchNotionAll(dbId, body){
  let all = [];
  let cursor, hasMore = true, pageCount = 0;
  while(hasMore && ++pageCount < 20){
    const req = cursor ? {...body, start_cursor:cursor} : body;
    const res = await fetch(`${WORKER_URL}/v1/databases/${dbId}/query`, {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+AUTH.token},
      body: JSON.stringify(req)
    });
    if(res.status === 401){ AUTH={token:'',expires:0}; try{localStorage.removeItem('sp_notionAuthToken');localStorage.removeItem('sp_notionAuthExpires');}catch(e){} applyAuthUI(); throw new Error('로그인이 만료되었습니다.'); }
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    all = all.concat(data.results||[]);
    cursor = data.next_cursor; hasMore = data.has_more;
  }
  return all;
}
function getText(p){
  if(!p) return '';
  if(p.type==='title') return (p.title||[]).map(t=>t.plain_text||'').join('');
  if(p.type==='rich_text') return (p.rich_text||[]).map(t=>t.plain_text||'').join('');
  if(p.type==='select') return p.select?.name || '';
  return '';
}
function getNum(p){ return p && p.type==='number' ? (Number(p.number)||0) : 0; }
function getDate(p){ return p && p.type==='date' && p.date ? (p.date.start||'').slice(0,10) : ''; }

function parseHolding(page){
  const pr = page.properties||{};
  return {
    id: page.id,
    date: getDate(pr['날짜']),
    code: getText(pr['종목코드']),
    name: getText(pr['종목명']),
    strategy: getText(pr['전략']) || '미분류',
    price: getNum(pr['현재가']),
    pnl: getNum(pr['평가손익']),
    pnlPct: getNum(pr['수익률']),
    buyPrice: getNum(pr['매 입 가']),
    buyAmt: getNum(pr['매입금액']),
    qty: getNum(pr['보유수량']),
    evalAmt: getNum(pr['평가금액']),
    weight: getNum(pr['보유비중'])
  };
}
function parseDaytrade(page){
  const pr = page.properties||{};
  return {
    id: page.id,
    date: getDate(pr['날짜']),
    code: getText(pr['종목코드']),
    name: getText(pr['종목명']),
    buyAvg: getNum(pr['금일매수평균가']),
    buyQty: getNum(pr['금일매수수량']),
    buyAmt: getNum(pr['금일매입금액']),
    sellAvg: getNum(pr['금일매도평균가']),
    sellQty: getNum(pr['금일매도수량']),
    sellAmt: getNum(pr['금일매도금액']),
    fee: getNum(pr['수수료제세금']),
    pnl: getNum(pr['손익금액']),
    pnlPct: getNum(pr['수익률'])
  };
}

let HOLDINGS = [];
let DAYTRADES = [];
let hFilter = 'ALL';

async function loadData(){
  if(!isAuthed()) return;
  try{
    const [hPages, dPages] = await Promise.all([
      fetchNotionAll(HOLDINGS_DB_ID, {page_size:100}),
      fetchNotionAll(DAYTRADE_DB_ID, {page_size:100, sorts:[{property:'날짜',direction:'descending'}]})
    ]);
    HOLDINGS = hPages.map(parseHolding).filter(r=>r.code);
    DAYTRADES = dPages.map(parseDaytrade).filter(r=>r.code);
    renderHoldings();
    buildDaytradeDateSel();
    renderDaytrade();
    const now = new Date();
    document.getElementById('lastUpdate').textContent = 'Update '+String(now.getMonth()+1).padStart(2,'0')+'.'+String(now.getDate()).padStart(2,'0')+' '+now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    document.getElementById('h-note').textContent = '⚠ 데이터 로드 실패: '+e.message;
  }
}

function setHFilter(s){
  hFilter = s;
  document.querySelectorAll('#h-filter .pill').forEach(b=>b.classList.toggle('on', b.dataset.val===s));
  renderHoldings();
}
function renderHoldings(){
  const strategies = ['전체','눌림목','괴리율','라운드넘버','기준선','장대양봉','미분류'];
  const counts = {};
  HOLDINGS.forEach(r=>{ counts[r.strategy] = (counts[r.strategy]||0)+1; });
  const filterEl = document.getElementById('h-filter');
  filterEl.innerHTML = strategies.map(s=>{
    const val = s==='전체' ? 'ALL' : s;
    const cnt = s==='전체' ? HOLDINGS.length : (counts[s]||0);
    if(s!=='전체' && cnt===0) return '';
    return `<button class="pill${hFilter===val?' on':''}" data-val="${val}" onclick="setHFilter('${val}')">${s} (${cnt})</button>`;
  }).join('');

  const rows = (hFilter==='ALL' ? HOLDINGS : HOLDINGS.filter(r=>r.strategy===hFilter))
    .slice().sort((a,b)=>b.pnlPct-a.pnlPct);

  const totalEval = HOLDINGS.reduce((s,r)=>s+r.evalAmt,0);
  const totalPnl = HOLDINGS.reduce((s,r)=>s+r.pnl,0);
  const totalBuy = HOLDINGS.reduce((s,r)=>s+r.buyAmt,0);
  const avgPct = totalBuy ? totalPnl/totalBuy : 0;
  document.getElementById('h-kpi').innerHTML = `
    <div class="kpi-card kpi-sky"><div class="num">${fmtNum(totalEval)}</div><div class="lbl">총 평가금액(원)</div></div>
    <div class="kpi-card ${totalPnl<0?'kpi-sky':'kpi-coral'}"><div class="num ${pctClass(totalPnl)}">${totalPnl>=0?'+':''}${fmtNum(totalPnl)}</div><div class="lbl">총 평가손익(원)</div></div>
    <div class="kpi-card kpi-amber"><div class="num ${pctClass(avgPct)}">${fmtPct(avgPct)}</div><div class="lbl">전체 평균수익률</div></div>
    <div class="kpi-card kpi-purple"><div class="num">${HOLDINGS.length}</div><div class="lbl">보유종목 수</div></div>
  `;

  const tbody = document.getElementById('h-tbody');
  if(!rows.length){
    tbody.innerHTML = '<tr><td colspan="11" class="empty-box">해당 전략 보유종목 없음</td></tr>';
  } else {
    tbody.innerHTML = rows.map(r=>`
      <tr>
        <td class="l">${strategyBadge(r.strategy)}</td>
        <td class="l">${esc(r.name)}</td>
        <td class="l">${esc(r.code)}</td>
        <td>${fmtNum(r.price)}</td>
        <td class="${pctClass(r.pnl)}">${r.pnl>=0?'+':''}${fmtNum(r.pnl)}</td>
        <td class="${pctClass(r.pnlPct)}">${fmtPct(r.pnlPct)}</td>
        <td>${fmtNum(r.buyPrice)}</td>
        <td>${fmtNum(r.qty)}</td>
        <td>${fmtNum(r.buyAmt)}</td>
        <td>${fmtNum(r.evalAmt)}</td>
        <td>${(r.weight*100).toFixed(2)}%</td>
      </tr>
    `).join('');
  }
  const latestDate = HOLDINGS.map(r=>r.date).filter(Boolean).sort().pop();
  document.getElementById('h-note').textContent = latestDate
    ? `데이터소스 : Notion 보유종목DB(실시간 연동) · 기준일 ${latestDate} · 전략은 노션에 수기 태깅된 확정값(미분류는 아직 태깅 전)`
    : '데이터 없음';
}

function buildDaytradeDateSel(){
  const dates = [...new Set(DAYTRADES.map(r=>r.date).filter(Boolean))].sort().reverse();
  const sel = document.getElementById('dt-date-sel');
  sel.innerHTML = dates.map(d=>`<option value="${d}">${d}</option>`).join('');
  if(dates.length) sel.value = dates[0];
}
function renderDaytrade(){
  const sel = document.getElementById('dt-date-sel');
  const date = sel.value;
  const rows = DAYTRADES.filter(r=>r.date===date);
  document.getElementById('dt-date-label').textContent = date || '';

  const totalPnl = rows.reduce((s,r)=>s+r.pnl,0);
  const wins = rows.filter(r=>r.pnl>0).length;
  const winRate = rows.length ? (wins/rows.length*100) : 0;
  document.getElementById('dt-kpi').innerHTML = `
    <div class="kpi-card kpi-sky"><div class="num">${rows.length}</div><div class="lbl">거래 종목수</div></div>
    <div class="kpi-card ${totalPnl<0?'kpi-sky':'kpi-coral'}"><div class="num ${pctClass(totalPnl)}">${totalPnl>=0?'+':''}${fmtNum(totalPnl)}</div><div class="lbl">당일 손익합계(원)</div></div>
    <div class="kpi-card kpi-purple"><div class="num">${winRate.toFixed(0)}%</div><div class="lbl">승률</div></div>
  `;

  const tbody = document.getElementById('dt-tbody');
  if(!rows.length){
    tbody.innerHTML = '<tr><td colspan="11" class="empty-box">해당 날짜 당일매매 내역 없음</td></tr>';
  } else {
    tbody.innerHTML = rows.slice().sort((a,b)=>b.pnl-a.pnl).map(r=>`
      <tr>
        <td class="l">${esc(r.name)}</td>
        <td class="l">${esc(r.code)}</td>
        <td>${fmtNum(r.buyAvg)}</td>
        <td>${fmtNum(r.buyQty)}</td>
        <td>${fmtNum(r.buyAmt)}</td>
        <td>${fmtNum(r.sellAvg)}</td>
        <td>${fmtNum(r.sellQty)}</td>
        <td>${fmtNum(r.sellAmt)}</td>
        <td>${fmtNum(r.fee)}</td>
        <td class="${pctClass(r.pnl)}">${r.pnl>=0?'+':''}${fmtNum(r.pnl)}</td>
        <td class="${pctClass(r.pnlPct)}">${fmtPct(r.pnlPct)}</td>
      </tr>
    `).join('');
  }
  document.getElementById('dt-note').textContent = date
    ? `데이터소스 : Notion 당일매매DB(실시간 연동) · HTS 거래내역 export 기반`
    : '데이터 없음';
}

// ── 설정모달 / 테마 ──────────────────────────────────────────
function openSettingsModal(){
  document.getElementById('settingsModal').classList.add('modal-open');
  syncThemeOptUI();
  applyAuthUI();
}
function closeSettingsModal(){
  document.getElementById('settingsModal').classList.remove('modal-open');
}
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem('theme', t); }catch(e){}
  syncThemeOptUI();
}
function syncThemeOptUI(){
  const cur = document.documentElement.getAttribute('data-theme');
  document.getElementById('theme-opt-dark')?.classList.toggle('on', cur === 'dark');
  document.getElementById('theme-opt-light')?.classList.toggle('on', cur === 'light');
}
function showTab(i){
  document.querySelectorAll('.panel').forEach((p,j)=>p.classList.toggle('on',j===i));
  document.querySelectorAll('.tab-btn').forEach((t,j)=>t.classList.toggle('on',j===i));
}
document.querySelectorAll('.tab-btn[data-tab]').forEach(btn=>{
  btn.addEventListener('click',()=>showTab(parseInt(btn.dataset.tab)));
  btn.addEventListener('touchend',e=>{e.preventDefault();showTab(parseInt(btn.dataset.tab));});
});

applyAuthUI();
if(isAuthed()) loadData();
</script>
